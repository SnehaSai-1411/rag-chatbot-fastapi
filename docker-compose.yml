services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CHROMA_DIR=/app/chroma_db
      - HISTORY_DB=/app/state/history.db
    volumes:
      - chroma_data:/app/chroma_db
      - history_data:/app/state
    # Ingest the sample docs on first start if the collection is empty,
    # then serve the API. (Re-running ingest is idempotent: duplicate
    # chunks are dropped by content hash.)
    command: >
      sh -c "python scripts/ingest_sample.py --persist-dir /app/chroma_db
      && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  ui:
    build: .
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    command: ["streamlit", "run", "ui/app.py", "--server.address", "0.0.0.0"]

volumes:
  chroma_data:
  history_data:
